[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
dynamic = ["version"]
description = "A desktop toolbox of small CSS and workflow utilities built with PySide6."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "PySide6>=6.9,<7",
  "requests>=2.32,<3",
  "pywin32>=311; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "PyInstaller>=6.0,<7",
  "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "core.version.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
